apiVersion: apps/v1
kind: Deployment
metadata:
  name: news-scheduler
  namespace: news-monitor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: news-scheduler
  template:
    metadata:
      labels:
        app: news-scheduler
    spec:
      containers:
        - name: scheduler
          image: news-monitor-api:local
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -m
            - uvicorn
            - app.main:app
            - --host
            - 0.0.0.0
            - --port
            - "8001"
            - --workers
            - "1"
          envFrom:
            - secretRef:
                name: news-api-env
          env:
            - name: ENABLE_SCHEDULER
              value: "true"
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 300m
              memory: 512Mi
