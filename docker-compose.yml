services:
  fastapi:
    build: .
    container_name: fastapi-server
    command: python -m uvicorn app.main:app --reload --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    volumes:
      - .:/code

  streamlit:
    build: .
    container_name: streamlit-app
    command: streamlit run streamlit-app/app.py --server.address=0.0.0.0 --server.port=8501
    ports:
      - "8501:8501"
    volumes:
      - .:/code
    depends_on:
      - fastapi