services:
  fastapi:
    build: .
    container_name: fastapi-server
    command: python -m uvicorn app.main:app --reload --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    volumes:
      - .:/code
    env_file:
      - .env

  react-app:
    build:
      context: ./react-app
    container_name: react-app
    ports:
      - "8501:8501"
    environment:
      - VITE_API_BASE_URL=/api/v1
    depends_on:
      - fastapi
